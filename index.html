<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Graph Studio v2</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script></head><body><header><div><h1>Math Graph Studio <span>v2</span></h1><p>関数・微分・積分・零点・極座標をまとめて扱う数学グラファー。</p></div><nav><button id="theme">🌙 ダーク</button><button id="sample">サンプル</button><button id="reset">リセット</button></nav></header><main><aside><div class="title"><h2>関数</h2><button id="add">＋ 追加</button></div><div id="list"></div><div class="grid"><label>x 最小<input id="xmin" type="number" value="-10" step=".5"></label><label>x 最大<input id="xmax" type="number" value="10" step=".5"></label><label>サンプル数<input id="samples" type="number" value="1800" min="100" max="10000" step="100"></label><label>モード<select id="mode"><option value="xy">x-y グラフ</option><option value="polar">極座標 r(θ)</option></select></label></div><button id="draw" class="wide">▶ 描画</button><section><h2>数学ツール</h2><label>対象<select id="target"></select></label><div class="tools"><button id="deriv">f′(x)</button><button id="roots">零点</button><button id="tangent">接線</button><button id="integral">数値積分</button></div><pre id="out">ここに計算結果が表示されます。</pre></section><details><summary>入力例</summary><ul><li><code>x^2</code>, <code>sin(x)</code>, <code>cos(x)</code>, <code>tan(x)</code></li><li><code>sqrt(x)</code>, <code>abs(x)</code>, <code>exp(x)</code></li><li><code>ln(x)</code>, <code>log10(x)</code>, <code>floor(x)</code></li><li><code>factorial(x)</code>, <code>gamma(x)</code></li><li>極座標: <code>1+cos(theta)</code></li></ul></details></aside><section class="graph"><div id="plot"></div><div id="status">準備完了。</div></section></main><footer>Math Graph Studio v2 · GitHub Pages · math.js + Plotly</footer><script src="script.js"></script></body></html>
