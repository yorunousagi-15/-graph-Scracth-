<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Grapher V4</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<header><div><h1>∫ Math Grapher <span>V4</span></h1><p>数値計算から複素解析まで扱う数学グラファー</p></div><button id="themeBtn">🌙</button></header>
<main>
<aside class="panel">
<section><label>モード</label><select id="mode">
<option value="cartesian">直交座標 y=f(x)</option>
<option value="parametric">パラメトリック</option>
<option value="polar">極座標</option>
<option value="complex">複素平面 f(z)</option>
<option value="critical">臨界線 s=1/2+it</option>
</select></section>

<section id="cartesianBox"><label>関数</label><div id="functions"></div><button class="secondary" id="addFn">＋ 関数を追加</button></section>

<section id="paramBox" class="hidden"><label>x(t)</label><input id="px" value="cos(t)">
<label>y(t)</label><input id="py" value="sin(t)">
<label>t の範囲</label><div class="row"><input id="tmin" value="0"><input id="tmax" value="2*pi"></div></section>

<section id="polarBox" class="hidden"><label>r(θ)</label><input id="polar" value="sin(3*theta)">
<label>θ の範囲</label><div class="row"><input id="thmin" value="0"><input id="thmax" value="2*pi"></div></section>

<section id="complexBox" class="hidden">
<label>複素関数</label><input id="complexFn" value="z^2">
<div class="quick"><button data-zeta="zeta">ζ(z)</button><button data-zeta="1/z">1/z</button><button data-zeta="exp(z)">e^z</button></div>
<label>Re(z)</label><div class="row"><input id="xminC" value="-2"><input id="xmaxC" value="2"></div>
<label>Im(z)</label><div class="row"><input id="yminC" value="-2"><input id="ymaxC" value="2"></div>
<label>表示量</label><select id="complexView"><option value="magnitude">|f(z)|</option><option value="phase">arg f(z)</option><option value="real">Re f(z)</option><option value="imag">Im f(z)</option></select>
<small>ζ(z) は数値的な近似表示です。極や収束域付近では精度に限界があります。</small>
</section>

<section id="criticalBox" class="hidden">
<label>関数</label><select id="criticalFn"><option value="zeta">ζ(s)</option></select>
<label>t の範囲</label><div class="row"><input id="cmin" value="0"><input id="cmax" value="40"></div>
<label>サンプル数</label><input id="csamples" type="number" value="900" min="100" max="3000">
</section>

<section id="rangeBox"><label>x の範囲</label><div class="row"><input id="xmin" value="-10"><input id="xmax" value="10"></div>
<label>サンプル数</label><input id="samples" type="number" value="1600" min="100" max="10000"></section>

<section id="analysisBox"><label>解析</label><div class="grid2">
<button id="derivBtn">f'(x)</button><button id="intBtn">定積分</button>
<button id="rootBtn">零点探索</button><button id="areaBtn">|f| の積分</button>
</div><div id="analysisResult" class="result">解析結果がここに表示されます。</div></section>
<button class="primary" id="plotBtn">▶ 描画</button>
<button class="secondary" id="clearBtn">クリア</button>
</aside>

<section class="content"><div id="plot"></div>
<div class="info"><div><b>V4</b><br>複素平面・ζ(s)・臨界線モードを追加。</div>
<div><b>例</b><br><code>sin(x)</code> <code>x^2</code> <code>exp(-x^2)</code></div>
<div><b>複素数</b><br><code>z^2</code> <code>exp(z)</code> <code>zeta(z)</code></div></div></section>
</main>
<footer>Math Grapher V4 · math.js + Plotly · GitHub Pages対応</footer>
<script src="script.js"></script>
</body></html>
